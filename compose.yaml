# Local development with hot reload: `make dev`.
# Production-like single container: `make up`.
services:
  backend:
    image: ghcr.io/astral-sh/uv:0.13-python3.15-trixie-slim
    working_dir: /app/backend
    command: sh -c "uv sync --locked && uv run --locked uvicorn chb.app:app --host 0.0.0.0 --port 8000 --reload --reload-dir src"
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy
      # Telemetry to the lgtm container (ADR-c17d). Unset it to turn telemetry off.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_LOGS_EXPORTER: otlp
      # Local only: export metrics after at most 5 s instead of 60 s.
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    volumes:
      - ./backend:/app/backend
      - backend-venv:/venv
      - uv-cache:/root/.cache/uv
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 20

  frontend:
    image: node:24-alpine
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run dev"
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app/frontend
      - frontend-node-modules:/app/frontend/node_modules
    ports: ["5173:5173"]
    depends_on:
      backend:
        condition: service_healthy

  # Grafana with Loki, Tempo and Prometheus behind one OTLP endpoint: http://localhost:3000.
  # Data lives in the container: `make down` discards it.
  # Started without a health dependency: the backend drops telemetry until it is up.
  # 0.39.0, not 0.40.0: 0.40.0 is younger than the 7-day release-age rule (2026-11-06).
  lgtm:
    image: grafana/otel-lgtm:0.39.0@sha256:4c8056c9c05fcb3c8fd93800e85334bfd79b4d0271b47a54a121a64af41fe1fe
    # Loopback only: Grafana here has anonymous admin access.
    ports: ["127.0.0.1:3000:3000"]

  app:
    profiles: ["prod"]
    build:
      context: .
      args:
        APP_VERSION: local
    ports: ["8080:8080"]

volumes:
  backend-venv:
  frontend-node-modules:
  uv-cache:
