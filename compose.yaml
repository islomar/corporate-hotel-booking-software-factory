# Local development with hot reload: `make dev`.
# Production-like single container: `make up`.
services:
  backend:
    image: ghcr.io/astral-sh/uv:0.13-python3.15-trixie-slim
    working_dir: /app/backend
    command: sh -c "uv sync --locked && uv run --locked uvicorn chb.app:app --host 0.0.0.0 --port 8000 --reload --reload-dir src"
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy
    volumes:
      - ./backend:/app/backend
      - backend-venv:/venv
      - uv-cache:/root/.cache/uv
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 20

  frontend:
    image: node:24-alpine
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run dev"
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app/frontend
      - frontend-node-modules:/app/frontend/node_modules
    ports: ["5173:5173"]
    depends_on:
      backend:
        condition: service_healthy

  app:
    profiles: ["prod"]
    build:
      context: .
      args:
        APP_VERSION: local
    ports: ["8080:8080"]

volumes:
  backend-venv:
  frontend-node-modules:
  uv-cache:
