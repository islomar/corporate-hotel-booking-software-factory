# Required check `triage`: a review with findings needs the agent's triage (CHB-60, ADR-ea8c decision 5).
#
# The latest review comment of the reviewer App (marker `chb-review reviewed:<sha>`) lists
# findings. While it has findings and no comment "Triage of review <sha>" from the agent's
# account (marker `chb-triage reviewed:<sha>`), this check fails. A comment from any other
# account does not count. It also fails on a truncated review, and when the PR head is not the
# reviewed commit and changes more than docs since it (CHB-195): the reads use the compare API.
# Logic and tests: factory/triage_review.py, factory/tests/test_triage_review.py.
#
# When it runs: on every push (`pull_request`). A new review comment or a triage comment arrives
# later, so triage-rerun.yml (issue_comment, from main) re-runs this workflow for the PR head. The run
# reads the live comments, so a re-run flips the result in place. A run that only reads comments
# needs no secret and a read-only token, so Dependabot PRs run it too (they have no review: it passes).
#
# Trust: the comments are data. The script reads them through the API, never runs or expands them,
# and the workflow puts no comment text in a shell. The workflow and script run from the PR's
# merge commit, as supply-chain.yml does: CODEOWNERS owns .github/ and factory/.
#
# `merge_group` (CHB-219): the merge queue waits for this required check on its own event. The PR passed
# it before entering the queue, so the job reports success without reading the PR.
name: Triage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions: {}

# CHB-219: only a push of a new head (`synchronize`, first attempt) cancels, and the run it cancels belongs
# to an older head. A run cancelled in progress leaves a cancelled check run on its head, which blocks the
# PR until someone re-runs it. triage-rerun.yml re-runs these runs: a re-run replays the original event, so
# `github.run_attempt` (1 on the first attempt) keeps it from cancelling. Merge queue runs group by their ref.
concurrency:
  group: triage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.run_attempt == '1' }}

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the comments of the PR
    steps:
      # CHB-219: on `merge_group` the PR passed this check before it entered the queue, and the event
      # carries no pull_request payload. This step reports the pass; the steps below skip.
      - name: Merge queue (checked on the PR)
        if: github.event_name == 'merge_group'
        run: echo "Checked on the pull request before it entered the merge queue."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'merge_group'
        with:
          persist-credentials: false
      - name: The latest review with findings has a triage from the agent
        if: github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 -I factory/triage_review.py --check "$PR" --repo "$REPO"
