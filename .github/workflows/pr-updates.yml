# Agent PRs stay up to date with main without the owner (CHB-172).
#
# Why: every merge to main leaves the other agent PRs behind. The owner's "Update branch" click
# makes the owner the last pusher, and the `main` ruleset requires approval of the last push by
# someone else (require_last_push_approval), so the owner's own approval stops counting.
# A push by the agent App does not have that effect.
#
# What: on every push to main, factory/pr_updates.py reads the open PRs opened by the agent App
# and, per PR (decision table in the script and in factory/tests/test_pr_updates.py):
# - behind main, mergeable: rebases it with `updatePullRequestBranch`, approved or not (strict
#   status checks are on, CHB-177, so a PR behind main cannot merge; the rebase dismisses an
#   approval and the owner approves the new head);
# - Dependabot PR behind main, mergeable: comments `@dependabot rebase` (only Dependabot may push
#   to its branches);
# - conflicting: adds the label `needs-rebase`. GitHub runs no `pull_request` workflow on a
#   conflicting PR, so its checks page would look green with no test run (docs/knowledge/).
#
# Trust: the job runs on main and checks out main only. It reads no PR content and runs no PR code:
# the PR list comes from the API and is data. The App key lives in the `agent-pr-updates`
# environment, which admits only main (ADR-d7b7, infra/github/environments.tf), not in repository
# secrets: any branch can add a `pull_request` workflow, and its copy would get repository secrets.
#
# Until the two secrets exist in that environment, the job prints a notice and does nothing.
name: PR updates

on:
  push:
    branches: [main]
  # For a manual run from main, for example right after the owner adds the secrets.
  workflow_dispatch:

permissions: {}

# Runs queue instead of cancelling: each one reads the state of main as of its own push.
concurrency:
  group: pr-updates
  cancel-in-progress: false

jobs:
  update:
    name: update
    if: github.repository == 'islomar/corporate-hotel-booking-software-factory'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: agent-pr-updates
    permissions:
      contents: read # checkout; the writes use the App token
    env:
      HAS_SECRETS: >-
        ${{ secrets.AGENT_APP_CLIENT_ID != '' &&
        secrets.AGENT_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Agent App secrets missing
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::AGENT_APP_CLIENT_ID or AGENT_APP_PRIVATE_KEY is not set in the agent-pr-updates environment. No PR updated."

      # github.sha is the main commit that was pushed. Only pr_updates.py runs from it.
      - name: Check out main (the script)
        if: env.HAS_SECRETS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Pushes by this token start workflow runs on the updated PR (GITHUB_TOKEN pushes would not).
      # contents: update the PR branch. pull-requests: labels. workflows: a PR that edits a workflow file.
      - id: app-token
        if: env.HAS_SECRETS == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Update agent PRs and flag conflicts
        if: steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: python3 -I factory/pr_updates.py --repo "$REPO"
