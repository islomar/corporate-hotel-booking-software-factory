name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/chb/app:${{ github.event.workflow_run.head_sha }}

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Build and push the image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --build-arg APP_VERSION=${{ github.event.workflow_run.head_sha }} -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy to Cloud Run
        run: gcloud run deploy chb --image "$IMAGE" --region "$REGION" --quiet
      - id: url
        run: echo "url=$(gcloud run services describe chb --region "$REGION" --format='value(status.url)')" >> "$GITHUB_OUTPUT"
      - name: Check the deployed version
        env:
          URL: ${{ steps.url.outputs.url }}
          EXPECTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          for i in $(seq 1 20); do
            version=$(curl -fsS "$URL/api/health" | jq -r .version) && [ "$version" = "$EXPECTED" ] && exit 0
            sleep 3
          done
          echo "Expected version $EXPECTED, got '$version'"; exit 1

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env:
          APP_URL: ${{ vars.APP_URL }}
