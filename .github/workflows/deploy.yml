name: Deploy
# For workflow_run triggers, GitHub lists main's HEAD at trigger time as the run's commit,
# not the commit being deployed. The run name shows the deployed commit instead. CHB-80.
run-name: Deploy ${{ github.event.workflow_run.head_sha }} (${{ github.event.workflow_run.display_title }})

on:
  # zizmor flags workflow_run as dangerous. The deploy job runs only for successful CI runs
  # of `push` events on this repository's main branch, never for pull requests or forks.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/chb/app:${{ github.event.workflow_run.head_sha }}

jobs:
  # CHB-173: `branches: [main]` matches the short name of the triggering ref, so a pushed tag named
  # `main` passes it, and a CI run from such a tag can carry its own workflow named "CI".
  # This job holds no credentials. It requires the real CI file and a commit on main, and every
  # other job needs it to succeed. The check comes from main's copy, never from the deployed commit.
  gate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
          fetch-depth: 0 # the ancestor check needs main's history
      - name: The commit is on main
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null || git fetch --no-tags origin "$HEAD_SHA" || true
          script="$RUNNER_TEMP/check_deploy_commit.py"
          git show refs/remotes/origin/main:scripts/check_deploy_commit.py > "$script"
          python3 -I "$script" --repo . --sha "$HEAD_SHA" --main-ref refs/remotes/origin/main

  deploy:
    needs: gate
    if: needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.url.outputs.url }}
    # The record job reads these. Job outputs are set even when a later step fails.
    outputs:
      started: ${{ steps.started.outputs.at }}
      finished: ${{ steps.finished.outputs.at }}
    steps:
      - id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Build and push the image
        env:
          APP_VERSION: ${{ github.event.workflow_run.head_sha }}
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --build-arg "APP_VERSION=$APP_VERSION" -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy to Cloud Run
        run: gcloud run deploy chb --image "$IMAGE" --region "$REGION" --quiet
      - id: url
        run: echo "url=$(gcloud run services describe chb --region "$REGION" --format='value(status.url)')" >> "$GITHUB_OUTPUT"
      - name: Check the deployed version
        env:
          URL: ${{ steps.url.outputs.url }}
          EXPECTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          for i in $(seq 1 20); do
            version=$(curl -fsS "$URL/api/health" | jq -r .version) && [ "$version" = "$EXPECTED" ] && exit 0
            sleep 3
          done
          echo "Expected version $EXPECTED, got '$version'"; exit 1
      - id: finished
        if: ${{ always() }}
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  smoke:
    needs: [gate, deploy]
    if: needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Browsers and their system packages ship in the image: no apt mirror on the critical path.
    # Keep the tag equal to @playwright/test in e2e/package-lock.json. Dependabot does not
    # update `container:` images: scripts/check_playwright_image.py fails `make check` and
    # the e2e CI job on a mismatch.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - run: npm ci
        working-directory: e2e
        timeout-minutes: 3
      - run: npx playwright test
        working-directory: e2e
        timeout-minutes: 3
        env:
          APP_URL: ${{ vars.APP_URL }}

  # One deployment event per production deploy (CHB-74): a Cloud Logging entry and a GitHub
  # deployment status. scripts/deploy_event.py builds and writes it. Every step and the job
  # tolerate failure, so a failed event write never turns the deploy red.
  record:
    needs: [gate, deploy, smoke]
    # Runs after a failed deploy too, but never when the gate refused: it gets deployer credentials.
    if: ${{ always() && needs.gate.result == 'success' && needs.deploy.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        continue-on-error: true
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        continue-on-error: true
      - name: Record the deployment event
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_START: ${{ needs.deploy.outputs.started }}
          DEPLOY_END: ${{ needs.deploy.outputs.finished }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
        run: python3 -I scripts/deploy_event.py
