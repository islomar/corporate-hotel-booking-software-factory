name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Dependency checks run inside the required jobs (backend, frontend, e2e), so auto-merge
# waits for them. See docs/decisions/ADR-ebe6-unattended-dependency-updates.md.
jobs:
  # CHB-117: a docs-only PR skips backend, frontend and e2e. They are required checks, so the
  # skip is a job-level `if:`, never a workflow `paths-ignore`: a workflow skipped by path
  # filtering leaves its required checks Pending, while a job skipped by `if:` reports success.
  # The allowlist is factory/review/docs_list.py (shared with the reviewer), run as it is on the
  # base commit so a PR cannot change the rule that judges it. Pushes to main always run every
  # job: deploy.yml deploys after CI succeeds, docs-only merges included.
  # Fail-safe: the test jobs run unless this job reports docs_only=true. If it fails, they run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.decide.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0 # the diff needs the merge base
      - name: Fetch the PR head and base (the merge ref can lag behind the event)
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          for sha in "$HEAD_SHA" "$BASE_SHA"; do
            git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"
          done
      - id: decide
        name: Docs-only PR? (allowlist from the base commit)
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          script="$RUNNER_TEMP/docs_list.py"
          if [ "$EVENT" = pull_request ] && git show "$BASE_SHA:factory/review/docs_list.py" > "$script" 2>/dev/null; then
            python3 -I "$script" --repo . --base "$BASE_SHA" --head "$HEAD_SHA" --event "$EVENT" > "$RUNNER_TEMP/decision"
          else
            echo "docs_only=false" > "$RUNNER_TEMP/decision"
          fi
          cat "$RUNNER_TEMP/decision"
          grep -x 'docs_only=\(true\|false\)' "$RUNNER_TEMP/decision" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Unit tests of the scripts and the factory
        working-directory: .
        run: |
          python3 -I -m unittest discover -s scripts/tests
          python3 -I -m unittest discover -s factory/tests
      - name: Release age (uv.lock upload times against exclude-newer)
        run: python3 -I ../scripts/check_release_age.py uv.lock
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked pyright
      - run: uv run --locked pytest

  frontend:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    # Dependabot alerts read: the release-age check exempts a fresh fix for an open alert (CHB-95).
    permissions:
      contents: read
      vulnerability-alerts: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the dependency checks diff the lockfile against the base branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm honours min-release-age
        run: make -C .. check-npm
      # Before npm ci: install scripts are untrusted and must not run before the step that holds the token (CHB-95).
      - name: Release age (new lockfile entries against min-release-age)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          # Only Dependabot PRs get the token: another branch could change the script to read every alert.
          GH_TOKEN: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.token || '' }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 -I ../scripts/check_release_age.py --base "origin/$BASE_REF" package-lock.json
      - run: npm ci
      - run: npm audit signatures
      - name: Provenance and trusted publisher downgrades
        if: github.event_name == 'pull_request'
        uses: danielroe/provenance-action@fcc45fd5a5b818c477432b32c838dcd0c79cd2dd # v0.2.0
        with:
          lockfile: frontend/package-lock.json
          base-ref: origin/${{ github.base_ref }}
      - run: npm run -s format:check
      - run: npm run -s lint
      - run: npm run -s typecheck
      - run: npm test

  e2e:
    # Dependabot alerts read: the release-age check exempts a fresh fix for an open alert (CHB-95).
    permissions:
      contents: read
      vulnerability-alerts: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, backend, frontend]
    if: >-
      ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' &&
      needs.backend.result == 'success' && needs.frontend.result == 'success' }}
    env:
      # Browsers and their system packages ship in this image: no apt mirror on the critical
      # path (CHB-101). Keep the tag equal to @playwright/test in e2e/package-lock.json:
      # scripts/check_playwright_image.py fails `make check` and this job on a mismatch.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the dependency checks diff the lockfile against the base branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Playwright images in ci.yml and deploy.yml match @playwright/test
        run: python3 -I scripts/check_playwright_image.py
      - name: Build and start the production image
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          docker build --build-arg "APP_VERSION=$APP_VERSION" -t chb:ci .
          docker run -d --name chb -p 8080:8080 chb:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/health && exit 0; sleep 1; done
          docker logs chb; exit 1
      # Before npm ci: install scripts are untrusted and must not run before the step that holds the token (CHB-95).
      - name: Release age (new lockfile entries against min-release-age)
        if: github.event_name == 'pull_request'
        working-directory: e2e
        env:
          BASE_REF: ${{ github.base_ref }}
          # Only Dependabot PRs get the token: another branch could change the script to read every alert.
          GH_TOKEN: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.token || '' }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 -I ../scripts/check_release_age.py --base "origin/$BASE_REF" package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npm audit signatures
        working-directory: e2e
      - name: Provenance and trusted publisher downgrades
        if: github.event_name == 'pull_request'
        uses: danielroe/provenance-action@fcc45fd5a5b818c477432b32c838dcd0c79cd2dd # v0.2.0
        with:
          lockfile: e2e/package-lock.json
          base-ref: origin/${{ github.base_ref }}
      - name: Pull the Playwright image
        run: docker pull "$PLAYWRIGHT_IMAGE"
        timeout-minutes: 3
      # The tests run in the Playwright image, on the runner's network, against the app
      # container started above. node_modules comes from the `npm ci` on the runner, whose
      # Node can differ from the image's: e2e dependencies must stay free of native modules.
      - name: Playwright tests in the Playwright image
        timeout-minutes: 5
        run: >-
          docker run --rm --network host --ipc host
          --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI -e APP_URL=http://localhost:8080
          -v "$PWD/e2e:/e2e" -w /e2e
          "$PLAYWRIGHT_IMAGE" npx playwright test
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
