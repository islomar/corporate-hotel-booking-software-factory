name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Dependency checks run inside the required jobs (backend, frontend, e2e), so auto-merge
# waits for them. See docs/decisions/ADR-ebe6-unattended-dependency-updates.md.
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Release age (uv.lock upload times against exclude-newer)
        run: python3 -I ../scripts/check_release_age.py uv.lock
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked pyright
      - run: uv run --locked pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the dependency checks diff the lockfile against the base branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm honours min-release-age
        run: make -C .. check-npm
      - run: npm ci
      - run: npm audit signatures
      - name: Release age (new lockfile entries against min-release-age)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 -I ../scripts/check_release_age.py --base "origin/$BASE_REF" package-lock.json
      - name: Provenance and trusted publisher downgrades
        if: github.event_name == 'pull_request'
        uses: danielroe/provenance-action@fcc45fd5a5b818c477432b32c838dcd0c79cd2dd # v0.2.0
        with:
          lockfile: frontend/package-lock.json
          base-ref: origin/${{ github.base_ref }}
      - run: npm run -s format:check
      - run: npm run -s lint
      - run: npm run -s typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the dependency checks diff the lockfile against the base branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Playwright image in deploy.yml matches @playwright/test
        run: python3 -I scripts/check_playwright_image.py
      - name: Build and start the production image
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          docker build --build-arg "APP_VERSION=$APP_VERSION" -t chb:ci .
          docker run -d --name chb -p 8080:8080 chb:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/health && exit 0; sleep 1; done
          docker logs chb; exit 1
      - run: npm ci
        working-directory: e2e
      - run: npm audit signatures
        working-directory: e2e
      - name: Release age (new lockfile entries against min-release-age)
        if: github.event_name == 'pull_request'
        working-directory: e2e
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 -I ../scripts/check_release_age.py --base "origin/$BASE_REF" package-lock.json
      - name: Provenance and trusted publisher downgrades
        if: github.event_name == 'pull_request'
        uses: danielroe/provenance-action@fcc45fd5a5b818c477432b32c838dcd0c79cd2dd # v0.2.0
        with:
          lockfile: e2e/package-lock.json
          base-ref: origin/${{ github.base_ref }}
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
        timeout-minutes: 5
      - run: npx playwright test
        working-directory: e2e
        env:
          APP_URL: http://localhost:8080
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
