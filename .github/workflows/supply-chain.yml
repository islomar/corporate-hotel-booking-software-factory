# Required check `supply-chain`: takes the code owner's place for supply-chain files.
# Design: docs/decisions/ADR-ebe6-unattended-dependency-updates.md, logic in
# scripts/check_supply_chain.py.
#
# A PR that changes a manifest, lockfile, image or runtime pin passes only if every commit
# is Dependabot's (and no release-age setting changed), or the human approved the head.
#
# The workflow and the script run from the PR's merge commit. CODEOWNERS keeps both files
# owned, so a PR that weakens them needs the human.
#
# `pull_request_review` re-runs the check after the human approves or a review is
# dismissed. Both events report a check run named `supply-chain` on the head commit, and a
# failed one keeps the required check red. So a review run that passes re-runs the failed
# runs of the same head (scripts/rerun_failed_supply_chain.py, CHB-184): the agent's App
# cannot re-run workflows, the workflow token can. A re-run reads the live reviews, so it
# passes only while the human's approval stands.
# Concurrency (CHB-219): runs of the same PR and event share a group, so they run one after another
# and the newest finishes last. Only a push of a new head (`synchronize`, first attempt) cancels, and the
# run it cancels belongs to an older head. A run cancelled in progress leaves a cancelled check run on its
# head, which blocks the PR until someone re-runs it (#142: two review runs; #151: two re-runs). Re-runs
# replay the original event, so `github.run_attempt` (1 on the first attempt) tells them apart. The events
# have separate groups: a `pull_request` run must not wait behind a review run.
#
# `merge_group` (CHB-219): the merge queue waits for this required check on its own event. The PR passed
# it before entering the queue, so the job reports success without reading the PR.
#
# `edited` re-runs the check when the PR's base branch changes: the diff and the release-age
# comparison depend on it. `edited` also fires on title and body edits. Those runs evaluate
# in full (about 20 s): a job skipped with `if:` reports success, and it could cancel and
# replace a failing run.
name: Supply chain

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:

permissions: {}

concurrency:
  group: supply-chain-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.run_attempt == '1' }}

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # commits and reviews of the PR
      actions: write # re-run failed runs of the same head after an approval
    steps:
      # CHB-219: on `merge_group` the PR passed this check before it entered the queue, and the event
      # carries no pull_request payload. This step reports the pass; the steps below skip.
      - name: Merge queue (checked on the PR)
        if: github.event_name == 'merge_group'
        run: echo "Checked on the pull request before it entered the merge queue."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'merge_group'
        with:
          persist-credentials: false
          fetch-depth: 0 # the check diffs the PR head against the base branch
      - name: Fetch the PR head and base (the merge ref can lag behind the event)
        if: github.event_name != 'merge_group'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          for sha in "$HEAD_SHA" "$BASE_SHA"; do
            git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"
          done
      - name: Supply-chain files need Dependabot or the human
        if: github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The human, not github.repository_owner: an organization owns the repository after CHB-204.
          OWNER: islomar
        run: >-
          python3 -I scripts/check_supply_chain.py
          --repo "$REPO" --pr "$PR" --base "$BASE_SHA" --head "$HEAD_SHA" --owner "$OWNER"
      - name: Re-run the failed runs of this head (the approval makes them pass)
        if: success() && github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: >-
          python3 -I scripts/rerun_failed_supply_chain.py
          --repo "$REPO" --head "$HEAD_SHA" --run-id "$RUN_ID"
