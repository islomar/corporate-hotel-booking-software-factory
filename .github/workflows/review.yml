# Automated PR review in shadow mode (ADR-ea8c, CHB-87, CHB-93, CHB-105).
#
# factory/review/plan.py decides first, from paths and diff size only: a docs-only PR gets a
# `neutral` check and no Claude call; a push that adds only docs since the last review carries that
# verdict forward; anything else is reviewed by Sonnet, or by Opus for high-risk paths or large diffs.
# Claude Code scores the PR against the CHB-40 rubric. factory/review/gate.py validates the
# output, recomputes Merge Safety and decides. The reviewer App posts the verdict as a check
# run named `review` on the PR head commit. The `main` ruleset does not require it yet (stage 1, shadow).
#
# Why workflow_run: review-trigger.yml runs on `pull_request` with no permissions and no secrets.
# When it completes, this workflow runs. GitHub takes a workflow_run workflow from the default
# branch (main), and its GITHUB_SHA and GITHUB_REF are main's. A branch that edits this file
# changes nothing until the edit is merged. CHB-93 replaced `pull_request_target`, which GitHub
# blocks on public repositories from 2026-12-02.
#
# Trust boundaries (GitHub Security Lab, "Preventing pwn requests"):
# - Any branch can add a workflow named "Review trigger", so the triggering run proves nothing.
#   The `resolve` job reads the head SHA from the workflow_run payload (set by GitHub), finds the
#   PR through the API, and requires (factory/review/resolve_pr.py): an open, non-draft PR into
#   main, from this repository, not by Dependabot, whose current head is that SHA.
#   No artifact or PR text is read here.
# - The `score-pr` job enters the `reviewer` environment only after `resolve` passed.
# - The workspace is main at the commit this file came from. The gate, schema and prompt come
#   from there, never from the PR.
# - The PR head is data: checked out into a separate directory, never installed, built, sourced
#   or run. No step restores or saves a cache. No `run:` block expands a PR-controlled string.
# - Claude runs with read-only tools, --safe-mode and --restricted, an empty HOME and config dir, and
#   never sees the reviewer App key or a GitHub token. It authenticates with the owner's subscription
#   token (claude setup-token); --bare cannot, as it reads only ANTHROPIC_API_KEY or apiKeyHelper.
#   The token is only in the env of the Claude step. The App token is minted after Claude exits.
#
# The three secrets live in the `reviewer` environment (main only). Until they exist there, the job
# prints a notice and posts nothing.
name: Review

on:
  # zizmor flags workflow_run as dangerous. This workflow runs only for `pull_request` runs of
  # this repository, validates the PR through the API, checks out the PR head only as data,
  # runs nothing from it, uses no cache and keeps no credentials in git config.
  # See the trust boundaries above.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Review trigger]
    types: [completed]

permissions: {}

# head_branch is PR-controlled text. It is used only as a concurrency key, never in a shell.
concurrency:
  group: review-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  # No secrets, no environment. Decides which PR and which commits are reviewed.
  resolve:
    name: resolve
    # Cheap filters on fields GitHub sets. The API checks below are the real control.
    # Fork PRs never reach the secrets: a fork PR gets no review, and the owner reviews it.
    # Dependabot PRs follow ADR-ebe6.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head-sha: ${{ steps.pr.outputs.head-sha }}
      base-sha: ${{ steps.pr.outputs.base-sha }}
    steps:
      # github.sha is the main commit this workflow file came from. Only resolve_pr.py runs from it.
      - name: Check out main (resolve script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - id: pr
        name: Find and validate the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::workflow_run.head_sha is not a commit SHA."; exit 1
          fi
          # The payload lists the PRs whose head is this SHA. It can be empty; then ask the API.
          numbers=$(jq -r '.workflow_run.pull_requests[]?.number' "$GITHUB_EVENT_PATH")
          if [ -z "$numbers" ]; then
            numbers=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '.[].number')
          fi
          files=()
          for n in $(printf '%s\n' "$numbers" | sort -n -u); do
            [[ "$n" =~ ^[0-9]+$ ]] || continue
            gh api "repos/$REPO/pulls/$n" > "$RUNNER_TEMP/pr-$n.json"
            files+=("$RUNNER_TEMP/pr-$n.json")
          done
          # Tested in factory/tests/test_resolve_pr.py. Prints number= and base-sha= lines, or nothing.
          python3 -I factory/review/resolve_pr.py --repo "$REPO" --head-sha "$HEAD_SHA" "${files[@]}" > "$RUNNER_TEMP/resolved"
          if [ ! -s "$RUNNER_TEMP/resolved" ]; then
            echo "::notice::No open, non-draft PR into main from this repository has head $HEAD_SHA. No review."
            exit 0
          fi
          cat "$RUNNER_TEMP/resolved" >> "$GITHUB_OUTPUT"
          echo "head-sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/resolved"

  # Not named `review`: a job check named `review` could be confused with the App's check.
  score-pr:
    name: score-pr
    needs: resolve
    if: needs.resolve.outputs.number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The reviewer secrets live in this environment, limited to the main branch, not in repository
    # secrets: any branch can add a `pull_request` workflow, and its copy would get repository secrets.
    # Environment branch rules match GITHUB_REF, which is main under workflow_run, so the environment admits this job.
    environment: reviewer
    permissions:
      contents: read
      pull-requests: read
      checks: read # earlier `review` check runs, for the round count and carry-forward
    env:
      HAS_SECRETS: >-
        ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' &&
        secrets.REVIEWER_APP_CLIENT_ID != '' &&
        secrets.REVIEWER_APP_PRIVATE_KEY != '' }}
      PR_NUMBER: ${{ needs.resolve.outputs.number }}
      BASE_SHA: ${{ needs.resolve.outputs.base-sha }}
      HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
      # Claude Code native binary from npm, pinned by version and SHA-256 of the tarball.
      CLAUDE_VERSION: 2.1.311
      CLAUDE_SHA256: 4353c611f9a33063c5525348a15f1212bdc0085e4a7a81b8370b790003df1b56
    steps:
      - name: Reviewer secrets missing
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::Reviewer secrets are not set. No review posted."

      # github.sha is the main commit this workflow file came from, so the gate matches the workflow.
      - name: Check out main (gate, schema, prompt)
        if: env.HAS_SECRETS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Data only. Nothing below executes, sources or installs a file from this checkout.
      - name: Fetch the PR head as data
        if: env.HAS_SECRETS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head-sha }}
          path: pr-head
          fetch-depth: 0 # the diff needs the merge base
          persist-credentials: false

      # Read with the job token before Claude runs: plan.py needs the last verdict, gate.py the round.
      - name: Earlier review runs on this PR
        if: env.HAS_SECRETS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          runs="$RUNNER_TEMP/prior-runs.json"
          for sha in $(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" --jq '.[].sha'); do
            gh api --paginate "repos/$REPO/commits/$sha/check-runs?check_name=review&filter=all" \
              --jq '.check_runs[] | {name, app: {slug: .app.slug}, head_sha, status, conclusion, external_id,
                completed_at, output: {title: .output.title, summary: .output.summary}}'
          done | jq -s '.' > "$runs" || echo '[]' > "$runs"

      - id: plan
        name: Prepare the review directory and plan the review
        if: env.HAS_SECRETS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          dir="$RUNNER_TEMP/review"
          mkdir -p "$dir"
          mv pr-head "$dir/head"
          git -C "$dir/head" diff --no-renames "$BASE_SHA...$HEAD_SHA" > "$dir/pr.diff"
          git -C "$dir/head" diff -z --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.z"
          tr '\0' '\n' < "$RUNNER_TEMP/changed-files.z" > "$dir/changed-files.txt"
          gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '{title: .title, body: .body}' > "$dir/pr.json"
          # Tested in factory/tests/test_review_plan.py. Prints action= and model= lines. Needs head/.git.
          python3 -I factory/review/plan.py --head-dir "$dir/head" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --prior-runs "$RUNNER_TEMP/prior-runs.json" --out "$RUNNER_TEMP/planned-check-run.json" > "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan" >> "$GITHUB_OUTPUT"
          rm -rf "$dir/head/.git"
          # A symlink in the PR could point at runner files, such as /proc/self/environ.
          find "$dir/head" -type l -delete

      - name: Install Claude Code
        if: env.HAS_SECRETS == 'true' && steps.plan.outputs.action == 'review'
        run: |
          tarball="$RUNNER_TEMP/claude-code.tgz"
          curl -fsSL -o "$tarball" \
            "https://registry.npmjs.org/@anthropic-ai/claude-code-linux-x64/-/claude-code-linux-x64-$CLAUDE_VERSION.tgz"
          echo "$CLAUDE_SHA256  $tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/claude-code"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/claude-code" --strip-components=1 package/claude

      # Flags: https://code.claude.com/docs/en/cli-reference. Env vars: https://code.claude.com/docs/en/env-vars
      # The prompt comes right after -p: --tools takes a variable number of values.
      # No --allowedTools: a bare "Read" allow rule would approve reads outside the working directory.
      # dontAsk allows reads inside it and denies everything else.
      # Isolation without --bare (CHB-105; tested with canary files, see ADR-ea8c decision 2):
      # - --safe-mode: no CLAUDE.md, AGENTS.md, rules, skills, plugins, hooks, MCP servers, agents or auto memory.
      # - --restricted: only --settings and managed settings load, file tools stay in the working directory.
      # - CLAUDE_CODE_DISABLE_CLAUDE_MDS, disableAllHooks, autoMemoryEnabled: false: the same, a second time.
      # - --strict-mcp-config, ENABLE_CLAUDEAI_MCP_SERVERS=false, disableClaudeAiConnectors: no MCP server,
      #   and none of the owner's claude.ai connectors (Gmail, Drive and others) that the token could reach.
      # - Empty HOME and CLAUDE_CONFIG_DIR: no user settings, memory, plugins or credentials files.
      - id: claude
        name: Review with Claude
        if: env.HAS_SECRETS == 'true' && steps.plan.outputs.action == 'review'
        timeout-minutes: 20
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          CLAUDE_CODE_DISABLE_CLAUDE_MDS: "1"
          CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
          ENABLE_CLAUDEAI_MCP_SERVERS: "false"
          MODEL: ${{ steps.plan.outputs.model }}
        run: |
          case "$MODEL" in
            claude-opus-5-5|claude-sonnet-5-5) ;;
            *) echo "::error::Unexpected model from plan.py."; exit 1 ;;
          esac
          export HOME="$RUNNER_TEMP/claude-home"
          export CLAUDE_CONFIG_DIR="$HOME/.claude"
          mkdir -m 700 "$HOME"
          mkdir -m 700 "$CLAUDE_CONFIG_DIR"
          cd "$RUNNER_TEMP/review"
          echo "Model: $MODEL"
          # Shows the auth method (expect an OAuth token, not an API key). Prints no email or org.
          "$RUNNER_TEMP/claude-code/claude" auth status | jq -c '{loggedIn, authMethod, apiProvider}' || true
          rc=0
          "$RUNNER_TEMP/claude-code/claude" \
            -p "Review the pull request in this directory. Follow the PR review instructions." \
            --safe-mode \
            --restricted \
            --model "$MODEL" \
            --tools "Read,Grep,Glob" \
            --permission-mode dontAsk \
            --settings '{"disableAllHooks":true,"autoMemoryEnabled":false,"disableClaudeAiConnectors":true,"permissions":{"blockReadsOutsideWorkingDirectories":true}}' \
            --strict-mcp-config \
            --no-session-persistence \
            --append-system-prompt-file "$GITHUB_WORKSPACE/factory/review/prompt.md" \
            --json-schema "$(cat "$GITHUB_WORKSPACE/factory/review/schema.json")" \
            --output-format json \
            --max-turns 40 \
            --max-budget-usd 1 \
            < /dev/null > "$RUNNER_TEMP/result.json" || rc=$?
          echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
          jq -c '{subtype, is_error, num_turns, total_cost_usd, duration_ms}' "$RUNNER_TEMP/result.json" || true

      # Everything below runs after Claude exited, even if a step above failed: the gate fails closed.
      - id: app-token
        if: ${{ !cancelled() && env.HAS_SECRETS == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.REVIEWER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-pull-requests: read

      - id: gate
        name: Gate and post the review check
        if: ${{ !cancelled() && steps.app-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          CLAUDE_EXIT: ${{ steps.claude.outputs.exit-code }}
          ACTION: ${{ steps.plan.outputs.action }}
        run: |
          payload="$RUNNER_TEMP/check-run.json"
          if [ "$ACTION" = skip ] || [ "$ACTION" = carry ]; then
            # Written by plan.py: a neutral check (docs-only PR) or the last verdict carried forward.
            cp "$RUNNER_TEMP/planned-check-run.json" "$payload" || true
          else
            python3 -I factory/review/gate.py \
              --result "$RUNNER_TEMP/result.json" \
              --claude-exit-code "${CLAUDE_EXIT:-1}" \
              --schema factory/review/schema.json \
              --changed-files "$RUNNER_TEMP/changed-files.z" \
              --prior-runs "$RUNNER_TEMP/prior-runs.json" \
              --app-slug "$APP_SLUG" \
              --head-sha "$HEAD_SHA" \
              --out "$payload" \
              --comment-out "$RUNNER_TEMP/comment.md" || true
          fi
          if [ ! -s "$payload" ]; then
            jq -n --arg sha "$HEAD_SHA" '{name: "review", head_sha: $sha, status: "completed", conclusion: "failure",
              output: {title: "Fail", summary: "The gate script produced no verdict. See the workflow run."}}' > "$payload"
          fi
          jq -r '.output.summary' "$payload" >> "$GITHUB_STEP_SUMMARY"
          # "View more details" opens this run, not the App's homepage (CHB-131).
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq --arg url "$run_url" '.details_url = $url' "$payload" > "$payload.tmp" && mv "$payload.tmp" "$payload"
          gh api -X POST "repos/$REPO/check-runs" --input "$payload" > /dev/null

      # CHB-141: a PR comment the owner reacts to with 👍 or 👎. factory/review/agreement.py counts them
      # (ADR-ea8c stage 1). gate.py writes the comment only for a valid model review.
      # Only after the check posted. Own token with pull requests write, and continue-on-error:
      # a missing permission or a failed comment never blocks the review check.
      - id: comment-token
        if: ${{ !cancelled() && steps.gate.outcome == 'success' && steps.plan.outputs.action == 'review' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.REVIEWER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Post the review comment
        if: ${{ !cancelled() && steps.comment-token.outputs.token != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.comment-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          comment="$RUNNER_TEMP/comment.md"
          if [ ! -s "$comment" ]; then
            echo "No valid model review: no comment."
            exit 0
          fi
          jq -n --rawfile body "$comment" '{body: $body}' > "$comment.json"
          gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" --input "$comment.json" > /dev/null
